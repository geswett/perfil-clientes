services:
  - type: web
    name: perfilador-clientes-puelche
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 600 --workers 2 --threads 4
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL_TEXT
        value: claude-sonnet-5
      - key: CLAUDE_MODEL_VISION
        value: claude-sonnet-5
      - key: CLAUDE_MODEL_TEXT_FALLBACK
        value: claude-haiku-4-5-20251001
      - key: CLAUDE_MODEL_VISION_FALLBACK
        value: claude-haiku-4-5-20251001
      - key: PYTHON_VERSION
        value: 3.11.9
